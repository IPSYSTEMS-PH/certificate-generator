        // Class definition
        var CertificateGenerator = function () {
            // Private variables
            var form = document.getElementById('certificate-form');
            var submitButton = document.getElementById('certificate-submit');
            var validation;

            // Private functions
            var initValidation = function () {
                // Init form validation rules. For more info check the FormValidation plugin's official documentation:https://formvalidation.io/
                validation = FormValidation.formValidation(
                    form, {
                    fields: {
                        organization_name: {
                            validators: {
                                notEmpty: {
                                    message: "Attendee Name is required"
                                }
                            }
                        },

                        certificate_statement: {
                            validators: {
                                notEmpty: {
                                    message: "Certification Statement is required"
                                }
                            }
                        },

                        ci_fullname: {
                            validators: {
                                notEmpty: {
                                    message: "Certificate Issuer Full Nameis required"
                                }
                            }
                        },
                        ci_position: {
                            validators: {
                                notEmpty: {
                                    message: "Certificate Issuer Position is required"
                                }
                            }
                        },
                        pi_fullname: {
                            validators: {
                                notEmpty: {
                                    message: "Principal Full Nameis required"
                                }
                            }
                        },
                        pi_position: {
                            validators: {
                                notEmpty: {
                                    message: "Principal Position is required"
                                }
                            }
                        },
                        date_issue: {
                            validators: {
                                notEmpty: {
                                    message: "Date of Issuance is required"
                                }
                            }
                        },

                    },
                    plugins: {
                        trigger: new FormValidation.plugins.Trigger(),
                        submitButton: new FormValidation.plugins.SubmitButton(),
                        // defaultSubmit: new FormValidation.plugins.DefaultSubmit(), // Uncomment this line to enable normal button submit after form validation
                        bootstrap: new FormValidation.plugins.Bootstrap5({
                            rowSelector: '.fv-row',
                            eleInvalidClass: '',
                            eleValidClass: ''
                        })
                    }
                }
                );

            }

            var handleForm = function () {
                submitButton.addEventListener('click', function (e) {
                    e.preventDefault();
                    validation.validate().then(function (status) {
                        if (status == 'Valid') {
                            swal.fire({
                                text: "Thank you! Your Certificate will generate",
                                icon: "success",
                                buttonsStyling: false,
                                confirmButtonText: "Ok, got it!",
                                customClass: {
                                    confirmButton: "btn fw-bold btn-light-primary"
                                }

                            });
                            generate_data();
                        } else {
                            swal.fire({
                                text: "Sorry, looks like there are some errors detected, please try again.",
                                icon: "error",
                                buttonsStyling: false,
                                confirmButtonText: "Ok, got it!",
                                customClass: {
                                    confirmButton: "btn fw-bold btn-light-primary"
                                }
                            });
                        }
                    });
                });
            }

            // Public methods
            return {
                init: function () {
                    initValidation();
                    handleForm();

                }
            }
        }();

        // On document ready
